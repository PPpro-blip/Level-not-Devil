// MEME SOUND ENGINE (Web Audio API - no downloads needed)
let ac = null;
function initAudio() { if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); }

function vineBoom() {
  initAudio();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(20, ac.currentTime + 0.6);
  g.gain.setValueAtTime(0.6, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.7);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.7);
}

function airhorn(delay=0) {
  setTimeout(() => {
    initAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(440, ac.currentTime);
    o.frequency.linearRampToValueAtTime(660, ac.currentTime + 0.3);
    g.gain.setValueAtTime(0.25, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.4);
  }, delay);
}

function errorBeep(delay=0) {
  setTimeout(() => {
    initAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.value = 800;
    g.gain.setValueAtTime(0.2, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.12);
  }, delay);
}

function sadTrombone(delay=0) {
  setTimeout(() => {
    initAudio();
    [440, 380, 320, 220].forEach((f, i) => {
      setTimeout(() => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sawtooth';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.18, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 0.35);
      }, i * 180);
    });
  }, delay);
}

function initPlat(p) { p.gone = false; p.timer = 0; p.touched = false; p.rev = false; p.shx = 0; }

function loadLvl(idx) {
  currLvl = idx;
  const L = lvls[idx];
  
  flipG = false; weakJ = false; weakJT = 0; invT = 0; darkT = 0; tinyT = 0; slipT = 0; windF = 0; windT = 0; quakeT = 0;
  shakeT = 0; particles = []; popups = []; deathAnimT = 0; lvlDeaths = 0;

  L.plats.forEach(initPlat);
  L.ceils.forEach(c => { c.trig = false; c.cy = c.y; c.vy = 0; });
  L.mspks.forEach(s => s.x = s.sx);
  L.gravs.forEach(g => g.on = false);
  L.trolls.forEach(t => t.trig = false);

  P.x = L.start.x; P.y = L.start.y;
  P.vx = 0; P.vy = 0; P.w = 24; P.h = 24;
  P.gnd = false; P.alive = true; P.face = 1; P.sq = 1; P.st = 1; P.trail = [];
  
  for (let k in keys) keys[k] = false;
  camX = 0;
  
  ui.level.textContent = `LV${idx+1}: ${L.name}`;
  ui.taunt.classList.remove('active');
}

function showTaunt(msg) {
  ui.taunt.textContent = msg;
  ui.taunt.classList.add('active');
  tauntT = 90;
}

function shake(amt) { shakeT = Math.max(shakeT, amt); }

function popup(x, y, txt, col) { popups.push({x, y, txt, col, life: 55, max: 55, vy: -1.2}); }

function emit(x, y, c, n, sp) {
  for (let i=0; i<n; i++) particles.push({
    x, y, vx: (Math.random()-0.5)*sp, vy: (Math.random()-0.5)*sp-2,
    c, sz: 1.5+Math.random()*4, life: 20+Math.random()*30
  });
}

function killPlayer() {
  if (!P.alive) return;
  P.alive = false; deaths++; lvlDeaths++;
  ui.death.textContent = `☠ ${deaths}`;
  
  emit(P.x+P.w/2, P.y+P.h/2, '#ff0040', 40, 10);
  shake(18);
  $('gameContainer').classList.remove('death-flash');
  void $('gameContainer').offsetWidth;
  $('gameContainer').classList.add('death-flash');
  
  lastDeathX = P.x; deathAnimT = 25;

  setTimeout(() => {
    let tnt = deadTaunts[Math.floor(Math.random() * deadTaunts.length)];
    if(deaths===10) tnt="10 deaths already?? 💀";
    if(deaths===25) tnt="25 DEATHS. career change time";
    if(deaths===50) tnt="FIFTY DEATHS. I'm actually impressed";
    if(deaths===69) tnt="nice... wait no that's 69 deaths 😂";
    if(deaths===100) tnt="💯 DEATHS ACHIEVEMENT UNLOCKED 💯";
    
    $('deathTaunt').textContent = tnt;
    $('deathStats').textContent = `Level Deaths: ${lvlDeaths} | Total: ${deaths}`;
    ui.screens.dead.classList.remove('hidden');
    state = 'dead';
  }, 350);
}

function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function update() {
  if (state !== 'play' || !P.alive) return;
  frame++;
  const L = lvls[currLvl];
  const gDir = flipG ? -1 : 1;
  const grav = G * gDir;
  const jp = weakJ ? P.jp * 0.55 : P.jp;
  
  if(weakJT>0 && !--weakJT) weakJ = false;
  if(invT>0) invT--;
  if(darkT>0) darkT--;
  if(tinyT>0 && !--tinyT) { P.w = 24; P.h = 24; }
  if(slipT>0) slipT--;
  if(windT>0 && !--windT) windF = 0;
  if(quakeT>0) { quakeT--; shake(3); }
  if(tauntT>0 && !--tauntT) ui.taunt.classList.remove('active');

  let eff = [];
  if(weakJ) eff.push('<span class="badge">🦵WEAK</span>');
  if(invT>0) eff.push('<span class="badge">🔄INVERT</span>');
  if(darkT>0) eff.push('<span class="badge">🌑DARK</span>');
  if(tinyT>0) eff.push('<span class="badge">🐜TINY</span>');
  if(slipT>0) eff.push('<span class="badge">🧊ICE</span>');
  if(windT>0) eff.push('<span class="badge">💨WIND</span>');
  if(quakeT>0) eff.push('<span class="badge">🌋QUAKE</span>');
  ui.effect.innerHTML = eff.join('');

  let ml = keys['ArrowLeft'] || keys['KeyA'];
  let mr = keys['ArrowRight'] || keys['KeyD'];
  let mj = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  
  if(invT>0) { let t = ml; ml = mr; mr = t; }

  const acc = slipT>0 ? 0.22 : 1;
  const fri = slipT>0 ? 0.98 : FRIC;

  if(ml) { P.vx -= P.spd * acc * 0.35; P.face = -1; }
  if(mr) { P.vx += P.spd * acc * 0.35; P.face = 1; }
  P.vx *= fri;
  if(windF) P.vx += windF * 0.08;
  P.vx = Math.max(-P.spd, Math.min(P.spd, P.vx));
  if(Math.abs(P.vx) < 0.1) P.vx = 0;

  if(mj && P.gnd) {
    P.vy = jp * gDir; P.gnd = false;
    P.sq = 0.6; P.st = 1.4;
    emit(P.x+P.w/2, P.y+(flipG?0:P.h), '#fff', 4, 4);
  }

  P.vy += grav;
  P.vy = Math.max(-MAX_FALL, Math.min(MAX_FALL, P.vy));

  // 1. Move X
  P.x += P.vx;
  
  // 2. Resolve X
  L.plats.forEach(p => {
    if(p.gone || p.t === 'fake') return;
    if (aabb(P.x, P.y+1, P.w, P.h-2, p.x, p.y, p.w, p.h)) {
      if (P.vx > 0) { P.x = p.x - P.w; P.vx = 0; }
      else if (P.vx < 0) { P.x = p.x + p.w; P.vx = 0; }
    }
  });

  // 3. Move Y
  P.y += P.vy;
  P.gnd = false;

  // 4. Resolve Y
  L.plats.forEach(p => {
    if(p.gone) return;
    if(p.t === 'fake') {
      if(!p.rev && aabb(P.x+1, P.y, P.w-2, P.h, p.x, p.y, p.w, p.h)) {
        p.rev = true; emit(p.x+p.w/2, p.y+p.h/2, '#ff4444', 20, 6);
        popup(p.x+p.w/2, p.y-10, "FAKE! 😂", "#ff4444"); shake(5);
      }
      return;
    }
    if (aabb(P.x+1, P.y, P.w-2, P.h, p.x, p.y, p.w, p.h)) {
      if (!flipG) {
        if (P.vy > 0) { P.y = p.y - P.h; P.vy = 0; P.gnd = true; if(P.st>1.1) { P.sq=1.3; P.st=0.7; } if(p.t==='dis' && !p.touched) { p.touched=true; p.timer=p.d; } }
        else if (P.vy < 0) { P.y = p.y + p.h; P.vy = 0; }
      } else {
        if (P.vy < 0) { P.y = p.y + p.h; P.vy = 0; P.gnd = true; if(P.st>1.1) { P.sq=1.3; P.st=0.7; } if(p.t==='dis' && !p.touched) { p.touched=true; p.timer=p.d; } }
        else if (P.vy > 0) { P.y = p.y - P.h; P.vy = 0; }
      }
    }
  });

  L.plats.forEach(p => {
    if(p.t!=='dis') return;
    if(p.touched && p.timer>0) {
      p.timer--; p.shx = p.timer<15 ? (Math.random()-0.5)*4 : 0;
      if(!p.timer) { p.gone=true; p.respawnT=150; emit(p.x+p.w/2, p.y, '#ffaa00', 12, 5); }
    }
    if(p.gone && !--p.respawnT) { p.gone=false; p.timer=0; p.touched=false; p.shx=0; }
  });

  L.pads.forEach(b => {
    if(aabb(P.x, P.y, P.w, P.h, b.x, b.y, b.w, b.h)) { P.vy = b.f * (flipG?-1:1); P.gnd=false; emit(b.x+b.w/2, b.y, '#00ffaa', 12, 6); shake(4); }
  });

  L.gravs.forEach(g => {
    let inZ = aabb(P.x, P.y, P.w, P.h, g.x, g.y, g.w, g.h);
    if(inZ && !g.on) { flipG = !flipG; g.on = true; emit(P.x+P.w/2, P.y+P.h/2, '#aa44ff', 20, 7); shake(8); popup(P.x+P.w/2, P.y-25, "FLIP! 🙃", "#aa44ff"); }
    if(!inZ) g.on = false;
  });

  L.spks.forEach(s => { if(aabb(P.x+2, P.y+2, P.w-4, P.h-4, s.x, s.y, s.w, s.h)) killPlayer(); });
  L.mspks.forEach(s => { s.x += s.s * s.dir; if(s.x<=s.sx || s.x>=s.ex) s.dir *= -1; if(aabb(P.x+2, P.y+2, P.w-4, P.h-4, s.x, s.y, s.w, s.h)) killPlayer(); });

  L.ceils.forEach(c => {
    if(!c.trig && Math.abs((P.x+P.w/2)-(c.x+c.w/2))<110) { c.trig=true; c.vy=0; }
    if(c.trig) { c.vy += 0.48; c.cy += c.vy; if(aabb(P.x+2, P.y+2, P.w-4, P.h-4, c.x, c.cy, c.w, c.h)) killPlayer(); if(c.cy > H+60) { c.cy = c.y; c.trig = false; c.vy = 0; } }
  });

  L.trolls.forEach(t => {
    if(t.trig) return;
    if(P.x+P.w > t.x && P.x < t.x+30) {
      t.trig = true;
      if(t.t==='msg') showTaunt(t.m);
      if(t.t==='weak') { weakJ = true; weakJT = t.d; popup(P.x, P.y-25, "WEAK!", "#ffaa00"); }
      if(t.t==='inv') { invT = t.d; shake(10); popup(P.x, P.y-25, "INVERTED", "#ff00ff"); }
      if(t.t==='dark') darkT = t.d;
      if(t.t==='tiny') { tinyT = t.d; P.w = 12; P.h = 12; }
      if(t.t==='slip') slipT = t.d;
      if(t.t==='wind') { windF = t.f; windT = t.d; }
      if(t.t==='quake') quakeT = t.d;
    }
  });

  if(P.y > H+80 || P.y < -120) killPlayer();
  if(P.x < 0) P.x = 0;

  if(aabb(P.x, P.y, P.w, P.h, L.door.x, L.door.y, L.door.w, L.door.h)) {
    if(currLvl < lvls.length - 1) {
      state = 'comp';
      $('completeTaunt').textContent = compTaunts[Math.floor(Math.random()*compTaunts.length)];
      $('completeStats').textContent = `Level Deaths: ${lvlDeaths} | Total: ${deaths}`;
      ui.screens.comp.classList.remove('hidden');
    } else {
      state = 'win';
      $('winMessage').textContent = deaths<15 ? "OK YOU'RE CRACKED 😤" : "YOU DID IT (finally) 😒";
      $('winDeaths').textContent = `Total Deaths: ${deaths}`;
      ui.screens.win.classList.remove('hidden');
    }
  }

  camX += ((P.x - W * 0.35) - camX) * 0.1;
  camX = Math.max(0, Math.min(L.len - W, camX));
  ui.prog.style.width = `${Math.min(P.x/L.len*100, 100)}%`;

  P.sq += (1-P.sq)*0.15; P.st += (1-P.st)*0.15;
  if(frame%2===0) { P.trail.push({x:P.x+P.w/2, y:P.y+P.h/2, l:10}); if(P.trail.length>12) P.trail.shift(); }
  P.trail.forEach(t => t.l--); P.trail = P.trail.filter(t => t.l>0);

  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; }); particles = particles.filter(p => p.life>0);
  popups.forEach(p => { p.y+=p.vy; p.life--; }); popups = popups.filter(p => p.life>0);
  
  if(shakeT>0) shakeT--;
  if(deathAnimT>0) deathAnimT--;
}

function render() {
  if(!lvls[currLvl]) return;
  const L = lvls[currLvl];
  
  ctx.clearRect(0, 0, W, H);
  let sx = 0, sy = 0;
  if(shakeT>0) { sx = (Math.random()-0.5)*shakeT; sy = (Math.random()-0.5)*shakeT; }
  
  ctx.save(); ctx.translate(sx, sy);

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, L.bg); grad.addColorStop(1, '#000');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 1;
  const gs = 50, ox = -camX % gs;
  for(let x=ox; x<W; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0; y<H; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for(let i=0; i<20; i++) ctx.fillRect(((i*137+frame*0.3)%W+W)%W, ((i*89+frame*0.2)%H+H)%H, 2, 2);

  ctx.save(); ctx.translate(-camX, 0);

  L.gravs.forEach(g => {
    const gr = ctx.createLinearGradient(g.x,0,g.x+g.w,0);
    gr.addColorStop(0,'rgba(170,68,255,0)'); gr.addColorStop(0.5,'rgba(170,68,255,0.15)'); gr.addColorStop(1,'rgba(170,68,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.fillStyle = 'rgba(170,68,255,0.3)';
    for(let ay=0; ay<g.h; ay+=40) {
      const off = ((Date.now()/400)*30+ay)%g.h;
      ctx.save(); ctx.translate(g.x+g.w/2, g.y+off); ctx.beginPath();
      if(flipG) { ctx.moveTo(0,8); ctx.lineTo(5,-3); ctx.lineTo(-5,-3); } else { ctx.moveTo(0,-8); ctx.lineTo(5,3); ctx.lineTo(-5,3); }
      ctx.fill(); ctx.restore();
    }
  });

  L.plats.forEach(p => {
    if(p.gone) { ctx.strokeStyle = 'rgba(255,170,0,0.15)'; ctx.setLineDash([3,4]); ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.setLineDash([]); return; }
    if(p.t==='fake' && !p.rev) {
      ctx.fillStyle = L.gnd; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(p.x, p.y, p.w, 2);
      ctx.fillStyle = 'rgba(255,0,0,0.02)'; ctx.fillRect(p.x, p.y, p.w, p.h);
      return;
    }
    if(p.t==='fake' && p.rev) { ctx.strokeStyle = 'rgba(255,0,0,0.3)'; ctx.setLineDash([3,5]); ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.setLineDash([]); return; }
    if(p.t==='dis' && p.touched && p.timer>0) {
      ctx.fillStyle = Math.sin(p.timer*0.45)>0 ? '#ff6600' : L.gnd; ctx.globalAlpha = 0.5 + (p.timer/p.d)*0.5;
    } else { ctx.fillStyle = L.gnd; ctx.globalAlpha = 1; }
    
    ctx.fillRect(p.x+p.shx, p.y, p.w, p.h); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(p.x+p.shx, p.y, p.w, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(p.x+p.shx, p.y+p.h-3, p.w, 3);
  });

  ctx.fillStyle = '#ff2244'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
  L.spks.forEach(s => {
    const sw = s.w / Math.max(1, Math.floor(s.w/10));
    for(let i=0; i<s.w/sw; i++) {
      ctx.beginPath(); ctx.moveTo(s.x+i*sw, s.y+s.h); ctx.lineTo(s.x+i*sw+sw/2, s.y); ctx.lineTo(s.x+(i+1)*sw, s.y+s.h); ctx.fill();
    }
  }); ctx.shadowBlur = 0;

  L.mspks.forEach(s => {
    ctx.strokeStyle = 'rgba(255,68,102,0.1)'; ctx.beginPath(); ctx.moveTo(s.sx+11, s.y+11); ctx.lineTo(s.ex+11, s.y+11); ctx.stroke();
    ctx.fillStyle = '#ff4466'; ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 12;
    ctx.save(); ctx.translate(s.x+11, s.y+11); ctx.rotate(Date.now()/120);
    for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(4,0); ctx.lineTo(-4,0); ctx.fill(); }
    ctx.fillStyle = '#ff8899'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
    ctx.restore(); ctx.shadowBlur = 0;
  });

  L.ceils.forEach(c => {
    if(c.cy<-25 && !c.trig) return;
    ctx.fillStyle = c.trig ? '#dd4400' : '#885522'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = c.trig ? 20 : 5;
    ctx.fillRect(c.x, c.cy, c.w, c.h); ctx.shadowBlur = 0;
    if(!c.trig && Math.abs((P.x+P.w/2)-(c.x+c.w/2))<140) { ctx.fillStyle = `rgba(255,100,0,0.1)`; ctx.fillRect(c.x-5, 0, c.w+10, H); }
  });

  L.pads.forEach(b => {
    const pls = Math.sin(Date.now()/150)*3;
    ctx.fillStyle = '#00ffaa'; ctx.shadowColor = '#00ffaa'; ctx.shadowBlur = 10+pls;
    ctx.fillRect(b.x, b.y-pls/2, b.w, b.h+pls);
    ctx.fillStyle = '#00cc88'; ctx.fillRect(b.x+1, b.y-pls/2+1, b.w-2, 2); ctx.shadowBlur = 0;
  });

  const d = L.door, dp = Math.sin(Date.now()/200)*4;
  ctx.shadowColor = '#00ff00'; ctx.shadowBlur = 20+dp;
  ctx.fillStyle = '#44ff44'; ctx.fillRect(d.x-3, d.y-3, d.w+6, d.h+6); ctx.shadowBlur = 0;
  ctx.fillStyle = '#002200'; ctx.fillRect(d.x+3, d.y+3, d.w-6, d.h-6);
  ctx.fillStyle = '#33cc33'; ctx.fillRect(d.x+7, d.y+7, d.w-14, d.h-14);

  P.trail.forEach(t => {
    const a = t.l/10; ctx.fillStyle = `rgba(68,170,255,${a*0.3})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 2.5*a, 0, Math.PI*2); ctx.fill();
  });

  if(P.alive) {
    ctx.save(); ctx.translate(P.x+P.w/2, P.y+P.h/2);
    if(flipG) ctx.scale(1,-1); ctx.scale(P.sq, P.st);
    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 15; ctx.fillStyle = '#00aaff';
    ctx.fillRect(-P.w/2, -P.h/2, P.w, P.h); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(-P.w/2+2, -P.h/2+2, P.w-4, P.h*0.5);
    
    ctx.fillStyle = '#000'; const ey = -2, px = P.face;
    ctx.fillRect(-6, ey, 4, 4); ctx.fillRect(3, ey, 4, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(-5+px, ey+1, 2, 2); ctx.fillRect(4+px, ey+1, 2, 2);
    ctx.fillStyle = '#000';
    if(weakJ) { ctx.beginPath(); ctx.moveTo(-4,7); ctx.quadraticCurveTo(0,4,4,7); ctx.lineWidth=1.5; ctx.strokeStyle='#000'; ctx.stroke(); }
    else if(invT>0) { ctx.fillRect(-3,6,7,2); }
    else if(darkT>0) { ctx.beginPath(); ctx.arc(0,7,3,0,Math.PI*2); ctx.fill(); }
    else if(Math.abs(P.vy)>6) { ctx.beginPath(); ctx.ellipse(0,7,3,4,0,0,Math.PI*2); ctx.fill(); }
    else { ctx.fillRect(-3,6,7,2); }
    ctx.restore();
  }

  if(!P.alive && deathAnimT>0) {
    ctx.globalAlpha = deathAnimT/25; ctx.fillStyle = '#ff0040'; ctx.font = '20px "Press Start 2P", monospace'; ctx.textAlign = 'center';
    ctx.fillText('💀', lastDeathX+12, P.y-deathAnimT*2); ctx.globalAlpha = 1;
  }

  particles.forEach(p => { ctx.globalAlpha = Math.min(p.life/30,1); ctx.fillStyle = p.c; ctx.fillRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz); }); ctx.globalAlpha = 1;
  popups.forEach(p => { ctx.globalAlpha = p.life/p.max; ctx.fillStyle = p.col; ctx.font = 'bold 10px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.fillText(p.txt, p.x, p.y); }); ctx.globalAlpha = 1;

  if(windF) {
    ctx.strokeStyle = 'rgba(200,200,255,0.1)'; ctx.lineWidth = 1;
    for(let i=0; i<20; i++) { ctx.beginPath(); const wx = camX+(frame*3+i*50)%W, wy = (i*73)%H; ctx.moveTo(wx, wy); ctx.lineTo(wx+Math.sign(windF)*(15+Math.random()*25), wy); ctx.stroke(); }
  }

  ctx.restore(); 

  if(darkT>0) {
    ctx.fillStyle = 'rgba(0,0,0,0.95)'; ctx.fillRect(0,0,W,H);
    if(P.alive) {
      const px = P.x+P.w/2-camX, py = P.y+P.h/2;
      ctx.save(); ctx.globalCompositeOperation = 'destination-out';
      const rg = ctx.createRadialGradient(px, py, 0, px, py, 65);
      rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(0.5, 'rgba(0,0,0,0.9)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(px, py, 65, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }
  }

  if(flipG) { ctx.fillStyle = 'rgba(170,68,255,0.3)'; ctx.font = 'bold 9px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.fillText('⬆ GRAVITY FLIPPED ⬆', W/2, 18); }
  
  ctx.restore();
}

function loop() { update(); render(); requestAnimationFrame(loop); }

$('startBtn').onclick = () => { ui.screens.start.classList.add('hidden'); buildLvls(); loadLvl(0); state = 'play'; deaths = 0; ui.death.textContent = '☠ 0'; showTaunt("GOOD LUCK 😈"); };
$('retryBtn').onclick = () => { ui.screens.dead.classList.add('hidden'); loadLvl(currLvl); state = 'play'; };
$('nextBtn').onclick = () => { ui.screens.comp.classList.add('hidden'); currLvl++; loadLvl(currLvl); state = 'play'; };
$('restartBtn').onclick = () => { ui.screens.win.classList.add('hidden'); buildLvls(); loadLvl(0); state = 'play'; deaths = 0; ui.death.textContent = '☠ 0'; };

loop();
</script>
</body>
