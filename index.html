<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL DEVIL - DEFINITIVE EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ff2a2a;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Hardware Accelerated Game Box */
        #gameContainer {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #ff0040;
            background: #050003;
            transform: translateZ(0); /* Force GPU acceleration */
            will-change: transform;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #uiHeader {
            position: absolute;
            top: 18px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 13px;
            color: #33000d;
            pointer-events: none;
            z-index: 10;
        }

        #screenOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 3, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
        }

        #overlayTitle {
            color: #ff0040;
            font-size: 32px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #overlayTaunt {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        #deathStats {
            color: #888888;
            font-size: 11px;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .btn {
            background: transparent;
            color: #ff0040;
            border: 2px solid #ff0040;
            padding: 12px 30px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #ff0040;
            color: #000000;
        }

        .hidden { display: none !important; }

        #toastBanner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            color: #ff0040;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            z-index: 15;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="uiHeader">
            <span id="titleLeft">LV1: WELCOME TO HELL</span>
            <span id="deathCounter">DEATHS: 0</span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="toastBanner">FAKE!</div>

        <div id="screenOverlay">
            <h1 id="overlayTitle">LEVEL DEVIL</h1>
            <p id="overlayTaunt">TRUST NOTHING.</p>
            <div id="deathStats" class="hidden"></div>
            <button class="btn" id="startBtn" onclick="initGame()">START</button>
        </div>
    </div>

<script>
// ===================================================
// FAST FIXED-TIMESTEP ENGINE (60 FPS GUARANTEED)
// ===================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const uiLeft = document.getElementById('titleLeft');
const uiDeaths = document.getElementById('deathCounter');
const overlay = document.getElementById('screenOverlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayTaunt = document.getElementById('overlayTaunt');
const deathStats = document.getElementById('deathStats');
const startBtn = document.getElementById('startBtn');
const toastBanner = document.getElementById('toastBanner');

const GAME_W = 800;
const GAME_H = 500;

// Optimized Physics Constants
const MOVE_SPEED = 280;
const GRAVITY = 1500;
const JUMP_FORCE = 520;
const MAX_FALL = 750;
const COYOTE_TIME = 0.08;
const JUMP_BUFFER = 0.08;

// Game State
let currentLevelIdx = 0;
let levelDeaths = 0;
let totalDeaths = 0;
let gameState = 'MENU';

// Inputs
const keys = { left: false, right: false, jump: false, jumpPressed: false };

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
        if (!keys.jump) keys.jumpPressed = true;
        keys.jump = true;
    }
    if (e.code === 'KeyR' && gameState === 'PLAYING') killPlayer("RESTARTED");
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jump = false;
});

// Player State
const player = {
    x: 50, y: 380, w: 22, h: 22,
    vx: 0, vy: 0,
    grounded: false,
    coyoteTimer: 0,
    jumpBufferTimer: 0,
    gravityDir: 1,
    controlsReversed: false,
    isDrunk: false,
    drunkAngle: 0,
    flipOnJump: false
};

let exitDoor = { x: 720, y: 412, w: 36, h: 56, active: true };
let platforms = [];
let spikes = [];
let triggers = [];

function triggerToast(msg) {
    toastBanner.innerText = msg;
    toastBanner.style.opacity = '1';
    setTimeout(() => { toastBanner.style.opacity = '0'; }, 900);
}

// ===================================================
// 15 BAMBOOZLE LEVELS
// ===================================================
const levelDefinitions = [
    {
        name: "LV1: WELCOME TO HELL",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            platforms.push({ x: 220, y: 390, w: 90, h: 16 });
            platforms.push({ x: 380, y: 310, w: 90, h: 16 });
            platforms.push({ x: 550, y: 230, w: 100, h: 16, id: 'drop' });
            exitDoor = { x: 580, y: 174, w: 36, h: 56, active: true };
            
            triggers.push({
                check: () => player.x > 480 && player.y < 260,
                run: () => {
                    const p = platforms.find(p => p.id === 'drop');
                    if (p) p.y = 520;
                    triggerToast("NOPE!");
                }
            });
        }
    },
    {
        name: "LV2: REVERSED",
        build: () => {
            player.controlsReversed = true;
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            platforms.push({ x: 250, y: 380, w: 300, h: 16 });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV3: DRUNK RUN",
        build: () => {
            player.isDrunk = true;
            platforms.push({ x: 0, y: 470, w: 180, h: 30 });
            platforms.push({ x: 260, y: 470, w: 120, h: 30 });
            platforms.push({ x: 460, y: 470, w: 120, h: 30 });
            platforms.push({ x: 640, y: 470, w: 160, h: 30 });
            spikes.push({ x: 180, y: 480, w: 80, h: 20 });
            spikes.push({ x: 380, y: 480, w: 80, h: 20 });
            spikes.push({ x: 580, y: 480, w: 60, h: 20 });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV4: GRAVITY FLIP",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            platforms.push({ x: 0, y: 0, w: 800, h: 30 });
            platforms.push({ x: 250, y: 350, w: 100, h: 16 });
            exitDoor = { x: 710, y: 30, w: 36, h: 56, active: true };
            
            triggers.push({
                check: () => player.x > 300,
                run: () => {
                    player.gravityDir = -1;
                    triggerToast("GRAVITY FLIP!");
                }
            });
        }
    },
    {
        name: "LV5: FAKE EXIT",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
            const realDoor = { x: 20, y: 414, w: 36, h: 56, active: false };
            
            triggers.push({
                check: () => player.x > 650,
                run: () => {
                    exitDoor.active = false;
                    realDoor.active = true;
                    exitDoor = realDoor;
                    triggerToast("BEHIND YOU!");
                }
            });
        }
    },
    {
        name: "LV6: COLLAPSE",
        build: () => {
            for (let i = 0; i < 10; i++) {
                platforms.push({ x: i * 80, y: 470, w: 74, h: 30, collapsible: true, timer: 0 });
            }
            exitDoor = { x: 730, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV7: INVISIBLE SPIKES",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            spikes.push({ x: 220, y: 445, w: 60, h: 25, hidden: true });
            spikes.push({ x: 400, y: 445, w: 60, h: 25, hidden: true });
            spikes.push({ x: 580, y: 445, w: 60, h: 25, hidden: true });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV8: THE CRUSHER",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            const crusher = { x: 360, y: -200, w: 100, h: 250, vy: 0, active: false };
            platforms.push(crusher);
            
            triggers.push({
                check: () => player.x > 300 && !crusher.active,
                run: () => {
                    crusher.active = true;
                    crusher.vy = 1200;
                    triggerToast("CRUSHED!");
                }
            });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV9: RUNAWAY EXIT",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
            let jumps = 0;
            
            triggers.push({
                check: () => Math.abs(player.x - exitDoor.x) < 90 && jumps < 3,
                run: function() {
                    jumps++;
                    if (jumps === 1) exitDoor.x = 400;
                    else if (jumps === 2) exitDoor.x = 150;
                    else if (jumps === 3) exitDoor.x = 710;
                    triggerToast("TOO SLOW!");
                    this.fired = false;
                }
            });
        }
    },
    {
        name: "LV10: JUMP FLIP",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            platforms.push({ x: 0, y: 0, w: 800, h: 30 });
            platforms.push({ x: 300, y: 220, w: 200, h: 20 });
            player.flipOnJump = true;
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV11: MOVING PIT",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 120, h: 30 });
            platforms.push({ x: 220, y: 400, w: 100, h: 16, vx: 140, minX: 180, maxX: 360 });
            platforms.push({ x: 480, y: 320, w: 100, h: 16, vx: -140, minX: 400, maxX: 600 });
            platforms.push({ x: 680, y: 470, w: 120, h: 30 });
            spikes.push({ x: 120, y: 480, w: 560, h: 20 });
            exitDoor = { x: 720, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV12: SPIKE SURPRISE",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30 });
            triggers.push({
                check: () => player.x > 320,
                run: () => {
                    spikes.push({ x: 360, y: 445, w: 120, h: 25 });
                    triggerToast("SURPRISE!");
                }
            });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV13: DRUNK & REVERSED",
        build: () => {
            player.isDrunk = true;
            player.controlsReversed = true;
            platforms.push({ x: 0, y: 470, w: 150, h: 30 });
            platforms.push({ x: 250, y: 420, w: 100, h: 16 });
            platforms.push({ x: 420, y: 360, w: 100, h: 16 });
            platforms.push({ x: 600, y: 470, w: 200, h: 30 });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV14: SINKING STEPS",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 100, h: 30 });
            for(let i=1; i<7; i++) {
                platforms.push({ x: i*110, y: 470 - i*20, w: 80, h: 20, collapsible: true, timer: 0 });
            }
            exitDoor = { x: 720, y: 314, w: 36, h: 56, active: true };
        }
    },
    {
        name: "LV15: FINAL TROLL",
        build: () => {
            platforms.push({ x: 0, y: 470, w: 800, h: 30, id: 'floor' });
            platforms.push({ x: 0, y: 0, w: 800, h: 30 });
            exitDoor = { x: 710, y: 414, w: 36, h: 56, active: true };
            
            triggers.push({
                check: () => player.x > 500,
                run: () => {
                    const fl = platforms.find(p => p.id === 'floor');
                    if (fl) fl.w = 400;
                    player.gravityDir = -1;
                    exitDoor.y = 30;
                    triggerToast("FINAL TROLL!");
                }
            });
        }
    }
];

function loadLevel(index) {
    platforms = [];
    spikes = [];
    triggers = [];
    
    player.x = 50;
    player.y = 380;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
    player.gravityDir = 1;
    player.controlsReversed = false;
    player.isDrunk = false;
    player.drunkAngle = 0;
    player.flipOnJump = false;

    const lvl = levelDefinitions[index];
    lvl.build();

    uiLeft.innerText = lvl.name;
    uiDeaths.innerText = `DEATHS: ${totalDeaths}`;
}

// ===================================================
// AABB COLLISION & PHYSICS STEP
// ===================================================
function intersects(a, b) {
    return !(b.x >= a.x + a.w || 
             b.x + b.w <= a.x || 
             b.y >= a.y + a.h || 
             b.y + b.h <= a.y);
}

function updatePhysics(dt) {
    if (gameState !== 'PLAYING') return;

    // Horizontal Movement
    let moveDir = 0;
    if (keys.left) moveDir -= 1;
    if (keys.right) moveDir += 1;
    if (player.controlsReversed) moveDir *= -1;

    player.vx = moveDir * MOVE_SPEED;

    if (player.isDrunk) {
        player.drunkAngle += dt * 8;
        player.vx += Math.sin(player.drunkAngle) * 140;
    }

    player.x += player.vx * dt;
    for (let p of platforms) {
        if (intersects(player, p)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
            player.vx = 0;
        }
    }

    // Vertical Jump & Timers
    if (player.grounded) player.coyoteTimer = COYOTE_TIME;
    else player.coyoteTimer -= dt;

    if (keys.jumpPressed) {
        player.jumpBufferTimer = JUMP_BUFFER;
        keys.jumpPressed = false;
    } else player.jumpBufferTimer -= dt;

    if (player.jumpBufferTimer > 0 && player.coyoteTimer > 0) {
        player.vy = -JUMP_FORCE * player.gravityDir;
        player.jumpBufferTimer = 0;
        player.coyoteTimer = 0;
        player.grounded = false;

        if (player.flipOnJump) player.gravityDir *= -1;
    }

    player.vy += GRAVITY * player.gravityDir * dt;
    if (player.gravityDir === 1 && player.vy > MAX_FALL) player.vy = MAX_FALL;
    if (player.gravityDir === -1 && player.vy < -MAX_FALL) player.vy = -MAX_FALL;

    player.y += player.vy * dt;
    player.grounded = false;

    for (let p of platforms) {
        if (intersects(player, p)) {
            if (p.collapsible && p.timer === 0) p.timer = 0.01;

            if (player.gravityDir === 1) {
                if (player.vy > 0) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                } else if (player.vy < 0) {
                    player.y = p.y + p.h;
                    player.vy = 0;
                }
            } else {
                if (player.vy < 0) {
                    player.y = p.y + p.h;
                    player.vy = 0;
                    player.grounded = true;
                } else if (player.vy > 0) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                }
            }
        }
    }

    // Dynamic Platform Updates
    for (let p of platforms) {
        if (p.vx) {
            p.x += p.vx * dt;
            if (p.x >= p.maxX || p.x <= p.minX) p.vx *= -1;
            if (player.grounded && intersects({x: player.x, y: player.y + 2, w: player.w, h: player.h}, p)) {
                player.x += p.vx * dt;
            }
        }
        if (p.active) {
            p.y += p.vy * dt;
            if (p.y >= 220) p.vy = -100;
            if (p.y <= -200) { p.y = -200; p.active = false; }
        }
        if (p.collapsible && p.timer > 0) {
            p.timer += dt;
            if (p.timer > 0.25) p.y += 600 * dt;
        }
    }

    // Hazards
    for (let s of spikes) {
        if (s.hidden && Math.abs(player.x - s.x) < 80) s.hidden = false;
        if (!s.hidden && intersects(player, s)) {
            killPlayer("SPIKED!");
            return;
        }
    }

    for (let t of triggers) {
        if (!t.fired && t.check()) {
            t.fired = true;
            t.run();
        }
    }

    if (exitDoor.active && intersects(player, exitDoor)) {
        advanceLevel();
        return;
    }

    if (player.y > GAME_H + 100 || player.y < -100) {
        killPlayer("FELL!");
    }
}

// ===================================================
// ZERO-LAG RENDERER (NO SHADOW BLURS)
// ===================================================
function render() {
    ctx.fillStyle = '#050003';
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // Sharp Grid
    ctx.strokeStyle = '#120008';
    ctx.lineWidth = 1;
    for (let x = 0; x < GAME_W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GAME_H); ctx.stroke();
    }
    for (let y = 0; y < GAME_H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_W, y); ctx.stroke();
    }

    // Platforms
    ctx.fillStyle = '#22000a';
    ctx.strokeStyle = '#ff0040';
    ctx.lineWidth = 2;
    for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    }

    // Spikes
    ctx.fillStyle = '#ff0040';
    for (let s of spikes) {
        if (s.hidden) continue;
        let count = Math.max(1, Math.floor(s.w / 12));
        let sw = s.w / count;
        for (let i = 0; i < count; i++) {
            ctx.beginPath();
            ctx.moveTo(s.x + i * sw, s.y + s.h);
            ctx.lineTo(s.x + i * sw + sw / 2, s.y);
            ctx.lineTo(s.x + (i + 1) * sw, s.y + s.h);
            ctx.fill();
        }
    }

    // Exit Door
    if (exitDoor.active) {
        ctx.fillStyle = '#ff0040';
        ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(exitDoor.x + exitDoor.w - 8, exitDoor.y + exitDoor.h / 2, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Player
    if (gameState === 'PLAYING') {
        ctx.fillStyle = '#ff0040';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(player.x, player.y, player.w, player.h);

        ctx.fillStyle = '#ffffff';
        let eyeY = (player.gravityDir === 1) ? player.y + 4 : player.y + 12;
        let eyeOffsetX = (player.vx > 0) ? 3 : ((player.vx < 0) ? -3 : 0);
        
        ctx.fillRect(player.x + 3 + eyeOffsetX, eyeY, 4, 4);
        ctx.fillRect(player.x + 12 + eyeOffsetX, eyeY, 4, 4);
    }
}

// ===================================================
// ACCUMULATOR LOOP (PREVENTS SLOW MOTION)
// ===================================================
let lastTime = performance.now();
let accumulator = 0;
const FIXED_STEP = 1 / 60; // 60 FPS Logic Step

function gameLoop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1; // Clamp lag spikes

    accumulator += dt;
    while (accumulator >= FIXED_STEP) {
        updatePhysics(FIXED_STEP);
        accumulator -= FIXED_STEP;
    }

    render();
    requestAnimationFrame(gameLoop);
}

function initGame() {
    gameState = 'PLAYING';
    totalDeaths = 0;
    levelDeaths = 0;
    currentLevelIdx = 0;
    overlay.classList.add('hidden');
    deathStats.classList.add('hidden');
    loadLevel(currentLevelIdx);
}

function killPlayer(reason) {
    if (gameState !== 'PLAYING') return;
    gameState = 'DEAD';
    levelDeaths++;
    totalDeaths++;
    uiDeaths.innerText = `DEATHS: ${totalDeaths}`;

    overlayTitle.innerText = "YOU DIED";
    overlayTaunt.innerText = "LOL";
    deathStats.innerText = `Level Deaths: ${levelDeaths} | Total: ${totalDeaths}`;
    deathStats.classList.remove('hidden');
    
    startBtn.innerText = "RETRY";
    startBtn.onclick = () => {
        gameState = 'PLAYING';
        overlay.classList.add('hidden');
        loadLevel(currentLevelIdx);
    };
    
    overlay.classList.remove('hidden');
}

function advanceLevel() {
    levelDeaths = 0;
    currentLevelIdx++;
    if (currentLevelIdx >= levelDefinitions.length) {
        gameState = 'WIN';
        overlayTitle.innerText = "YOU SURVIVED!";
        overlayTaunt.innerText = "IMPOSSIBLE.";
        deathStats.innerText = `TOTAL DEATHS: ${totalDeaths}`;
        deathStats.classList.remove('hidden');
        
        startBtn.innerText = "PLAY AGAIN";
        startBtn.onclick = initGame;
        overlay.classList.remove('hidden');
    } else {
        loadLevel(currentLevelIdx);
    }
}

// Start Engine
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
